<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.52 0.15 162); }
    a:hover { color: oklch(0.42 0.14 162); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: oklch(0.98 0.008 95); font-family: 'Public Sans', system-ui, sans-serif; color: oklch(0.24 0.02 250);">

  <!-- The screen behind, dimmed. The dialog is not a page of its own. -->
  <div style="position: absolute; inset: 0; padding: 28px 20px 0 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em;">Albums</div>
    <div style="border-radius: 28px; padding: 22px; background: oklch(0.29 0.06 168); height: 96px;"></div>
    <div style="border-radius: 22px; background: oklch(1 0 0); border: 1px solid oklch(0.92 0.01 250); height: 86px;"></div>
    <div style="border-radius: 22px; background: oklch(1 0 0); border: 1px solid oklch(0.92 0.01 250); height: 86px;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: oklch(0.20 0.02 250 / 0.52);"></div>

  <div style="position: absolute; left: 20px; right: 20px; top: 50%; transform: translateY(-50%);">
    <div style="border-radius: 30px; background: oklch(0.99 0.004 95); padding: 26px 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px oklch(0.20 0.02 250 / 0.35);">

      <!-- Warm, not red. This is a consent, not an error — the album is about to start doing
           exactly what Archive means, which is what the user is being asked to agree to. -->
      <div style="width: 52px; height: 52px; border-radius: 18px; background: oklch(0.94 0.06 70); display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(0.50 0.14 55)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
      </div>

      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 25px; line-height: 1.15; letter-spacing: -0.02em;">Archive this album?</div>

      <div style="display: flex; flex-direction: column; gap: 13px; font-size: 14px; line-height: 1.55; color: oklch(0.36 0.015 250);">
        <div>Files in <strong style="font-weight: 600; color: oklch(0.24 0.02 250);">12345clips</strong> will leave your gallery and move to OneDrive once they are verified there.</div>

        <!-- The standing-instruction sentence. It is the part people miss, so it is the part that
             gets the tinted panel rather than being buried mid-paragraph. -->
        <div style="border-radius: 16px; background: oklch(0.955 0.03 70); padding: 13px 15px; font-size: 13.5px; line-height: 1.5; color: oklch(0.38 0.07 55);">
          Files added to this album <strong style="font-weight: 600;">later</strong> are covered by the same choice.
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px; padding-top: 4px;">
        <div style="text-align: center; padding: 14px 0; border-radius: 99px; background: oklch(0.44 0.13 55); color: oklch(0.99 0.01 80); font-weight: 600; font-size: 15px;">Archive</div>
        <div style="text-align: center; padding: 14px 0; border-radius: 99px; font-weight: 600; font-size: 15px; color: oklch(0.36 0.02 250);">Cancel</div>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
